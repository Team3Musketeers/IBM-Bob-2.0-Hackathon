<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostwriter - Communication Debt Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #111827; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .prose-block { white-space: pre-line; line-height: 1.65; }
        .prose-block code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: #F3F4F6; padding: 0.1em 0.3em; border-radius: 3px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative bg-[#FAFAFA]">

    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-200/40 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-rose-200/40 blur-[100px]"></div>
        <div class="absolute top-[30%] left-[60%] w-[35%] h-[35%] rounded-full bg-purple-200/30 blur-[120px]"></div>
    </div>

    <header class="bg-white/70 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center shadow-sm">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h1 class="text-xl font-semibold tracking-tight text-gray-900">Ghostwriter <span class="text-gray-400 font-normal">Communication Debt</span></h1>
            </div>
            <p class="text-xs text-gray-400 mono hidden md:block text-right" id="provenance"></p>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">

        <div id="notes"></div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8" id="kpi-container"></div>

        <div class="flex justify-between items-end mb-4 px-1 flex-wrap gap-2">
            <div class="flex gap-4 text-xs font-medium text-gray-500 flex-wrap" id="legend"></div>
            <span class="text-xs text-gray-400 italic">Click any row to expand the full audit</span>
        </div>

        <div class="bg-white/80 backdrop-blur-sm rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div id="table-container">
                <div class="p-12 text-center">
                    <div class="inline-block w-6 h-6 border-2 border-gray-900 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-gray-500 font-medium text-sm">Loading audit data...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-8">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm text-gray-400 space-y-1">
            <p>Built for IBM Bob 2.0 Hackathon.</p>
            <p class="text-xs">Scores come from the synthesis step in <span class="mono">prompts/synthesis.md</span>. This view only validates and renders them.</p>
        </div>
    </footer>

    <script>
        const BAND_STYLES = {
            low:    { chip: 'bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/20', dot: 'bg-emerald-500' },
            medium: { chip: 'bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20',       dot: 'bg-amber-500' },
            high:   { chip: 'bg-rose-50 text-rose-700 ring-1 ring-inset ring-rose-600/20',           dot: 'bg-rose-500' }
        };

        const CONSENSUS_STYLES = {
            aligned:        { dot: 'bg-emerald-500', text: 'Aligned' },
            partial:        { dot: 'bg-amber-500',   text: 'Partial' },
            diverged:       { dot: 'bg-rose-500',    text: 'Diverged' },
            'not recorded': { dot: 'bg-gray-300',    text: 'n/a' }
        };

        const esc = (value) => String(value ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const inlineCode = (escaped) => escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        const prose = (text) => `<div class="prose-block">${inlineCode(esc(text))}</div>`;

        const kpi = (label, value, accent = '') => `
            <div class="bg-white/80 backdrop-blur-sm p-5 rounded-xl border border-gray-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">${esc(label)}</p>
                <p class="text-2xl font-semibold ${accent || 'text-gray-900'}">${esc(value)}</p>
            </div>`;

        const countChip = (n, tone, label) => n > 0
            ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${tone}">${esc(label ?? n)}</span>`
            : `<span class="text-gray-300">&mdash;</span>`;

        function renderBreakdown(breakdown) {
            const parts = [
                ['Description gap', breakdown.description_gap, 'bg-indigo-400'],
                ['Scope creep', breakdown.scope_creep, 'bg-amber-400'],
                ['Unanswered risk', breakdown.unanswered_risk, 'bg-rose-400']
            ];
            const total = parts.reduce((sum, p) => sum + p[1], 0) || 1;
            return `
                <div class="space-y-3">
                    <div class="flex h-2 rounded-full overflow-hidden bg-gray-100">
                        ${parts.map(p => `<div class="${p[2]}" style="width:${(p[1] / total) * 100}%" title="${esc(p[0])}: ${p[1]}"></div>`).join('')}
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        ${parts.map(p => `
                            <div>
                                <div class="flex items-center gap-1.5 text-gray-500">
                                    <span class="w-2 h-2 rounded-full ${p[2]}"></span>${esc(p[0])}
                                </div>
                                <div class="mono font-semibold text-gray-900 mt-0.5">${p[1]}</div>
                            </div>`).join('')}
                    </div>
                </div>`;
        }

        function renderConsensus(pr) {
            const key = pr.agent_consensus || 'not recorded';
            const style = CONSENSUS_STYLES[key] || CONSENSUS_STYLES['not recorded'];
            const badge = `<span class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-600">
                <span class="w-2 h-2 rounded-full ${style.dot}"></span>${esc(style.text)}</span>`;
            if (key === 'not recorded') {
                return `<div class="flex items-center gap-3">${badge}
                    <span class="text-xs text-gray-400">Synthesis run predates disagreement detection.</span></div>`;
            }
            const review = pr.human_review_recommended
                ? `<span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase tracking-wider bg-rose-50 text-rose-700 ring-1 ring-inset ring-rose-600/20">Human review</span>`
                : `<span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase tracking-wider bg-gray-100 text-gray-500">Auto-ok</span>`;
            return `<div class="space-y-3">
                <div class="flex items-center gap-3 flex-wrap">${badge}${review}</div>
                ${pr.disagreement_note ? prose(pr.disagreement_note) : ''}
            </div>`;
        }

        function renderPanel(pr) {
            const flags = pr.subagent_b.scope_flags;
            const flagsHtml = flags.length
                ? `<ul class="space-y-3">${flags.map(f => `
                    <li class="border-l-2 border-amber-400 pl-3">
                        <span class="text-[11px] font-semibold uppercase tracking-wider text-amber-600">${esc(f.type)}</span>
                        ${prose(f.detail)}
                    </li>`).join('')}</ul>`
                : `<p class="text-sm text-emerald-700">No scope flags recorded.</p>`;

            const undisclosed = pr.subagent_a.undisclosed_changes;
            const undisclosedHtml = undisclosed.length
                ? `<ul class="space-y-2.5">${undisclosed.map(c => `
                    <li class="flex gap-2">
                        <span class="text-rose-500 font-bold leading-6 select-none">&bull;</span>
                        <span>${inlineCode(esc(c))}</span>
                    </li>`).join('')}</ul>`
                : `<p class="text-sm text-emerald-700">Nothing undisclosed.</p>`;

            const questions = pr.subagent_c.predicted_questions;
            const questionsHtml = questions.length
                ? `<ol class="space-y-3">${questions.map((q, i) => `
                    <li class="flex gap-3">
                        <span class="mono text-xs font-semibold text-gray-400 mt-0.5 shrink-0">Q${i + 1}</span>
                        <span>
                            ${inlineCode(esc(q.question))}
                            ${q.file ? `<span class="block mono text-[11px] text-gray-400 mt-1">${esc(q.file)}${q.line ? `:${esc(q.line)}` : ''}</span>` : ''}
                        </span>
                    </li>`).join('')}</ol>`
                : `<p class="text-sm text-gray-400">No questions recorded.</p>`;

            const ticket = pr.subagent_b.ticket_linked
                ? `<span class="text-[11px] font-semibold uppercase tracking-wider text-emerald-600">Ticket linked</span>
                   <span class="text-[11px] text-gray-400">(${esc(pr.subagent_b.ticket_source)})</span>`
                : `<span class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">No ticket linked</span>`;

            return `
            <div class="hidden bg-gray-50/40 px-6 sm:px-8 py-8 border-b border-gray-200">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-gray-500 mb-3 uppercase text-xs tracking-wider">Author's Claim</h4>
                        ${pr.author_claim ? prose(pr.author_claim) : '<p class="text-sm text-gray-400">No description provided.</p>'}
                        <p class="mono text-[11px] text-gray-400 mt-4 pt-3 border-t border-gray-100">${esc(pr.diffstat || 'no diffstat')}</p>
                    </div>
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm lg:col-span-2">
                        <h4 class="font-semibold text-indigo-600 mb-3 uppercase text-xs tracking-wider">Subagent A &middot; Technical Truth-Teller</h4>
                        ${prose(pr.subagent_a.true_summary)}
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-rose-600 mb-3 uppercase text-xs tracking-wider">
                            Undisclosed Changes <span class="mono text-gray-400">(${undisclosed.length})</span>
                        </h4>
                        ${undisclosedHtml}
                    </div>
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-amber-600 mb-1 uppercase text-xs tracking-wider">Subagent B &middot; Scope Auditor</h4>
                        <div class="mb-3">${ticket}</div>
                        ${flagsHtml}
                    </div>
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-purple-600 mb-3 uppercase text-xs tracking-wider">
                            Subagent C &middot; Reviewer's Ghost <span class="mono text-gray-400">(${questions.length})</span>
                        </h4>
                        ${questionsHtml}
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-gray-500 mb-4 uppercase text-xs tracking-wider">Score Breakdown</h4>
                        ${renderBreakdown(pr.score_breakdown)}
                        <p class="mono text-[11px] text-gray-400 mt-4 pt-3 border-t border-gray-100">source: ${esc(pr.source_file)}</p>
                    </div>
                    <div class="bg-white/90 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h4 class="font-semibold text-gray-500 mb-4 uppercase text-xs tracking-wider">Agent Consensus</h4>
                        ${renderConsensus(pr)}
                    </div>
                </div>

                ${pr._note ? `<p class="text-xs text-gray-400 italic mt-4">Note: ${esc(pr._note)}</p>` : ''}
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const tableContainer = document.getElementById('table-container');
            const kpiContainer = document.getElementById('kpi-container');

            try {
                const response = await fetch('./dashboard_data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data.prs) || !data.prs.length) throw new Error('no PRs in dataset');

                const notes = data._notes || [];
                if (notes.length) {
                    document.getElementById('notes').innerHTML = `
                        <div class="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                            <p class="text-xs font-semibold uppercase tracking-wider text-amber-700 mb-2">
                                Synthesis conflicts (${notes.length})
                            </p>
                            <ul class="space-y-1.5">${notes.map(n => `
                                <li class="text-sm text-amber-900">${esc(n)}</li>`).join('')}</ul>
                            <p class="text-xs text-amber-700 mt-3">
                                Two runs of the same PR disagree. The richer run is shown; reconcile the source files before treating these scores as final.
                            </p>
                        </div>`;
                }

                const s = data.summary;
                kpiContainer.innerHTML = [
                    kpi('PRs Audited', s.prs_audited),
                    kpi('Undisclosed Changes', s.total_undisclosed_changes),
                    kpi('Scope Flags', s.total_scope_flags),
                    kpi('Reviewer Questions', s.total_predicted_questions),
                    kpi('Mean Debt Score', s.mean_score),
                    kpi('Needs Human Review', s.human_review_recommended, 'text-rose-600')
                ].join('');

                document.getElementById('provenance').textContent = 'rendered from dataset/audit*.json';

                const bandLabels = data.bands || {};
                document.getElementById('legend').innerHTML = ['low', 'medium', 'high'].map(band => `
                    <span class="flex items-center gap-1.5">
                        <div class="w-2 h-2 rounded-full ${BAND_STYLES[band].dot}"></div>
                        ${band.charAt(0).toUpperCase() + band.slice(1)} (${esc(bandLabels[band] || '')})
                    </span>`).join('');

                const rows = data.prs.map(pr => {
                    const band = BAND_STYLES[pr.score_band] ? pr.score_band : 'low';
                    const t = pr.totals;
                    const consensusKey = pr.agent_consensus || 'not recorded';
                    const consensus = CONSENSUS_STYLES[consensusKey] || CONSENSUS_STYLES['not recorded'];
                    const flag = pr.human_review_recommended
                        ? ' ring-rose-500/40' : '';

                    return `
                    <div class="border-b border-gray-100 hover:bg-white/60 transition-colors">
                        <div class="grid grid-cols-12 gap-3 px-6 py-4 items-center cursor-pointer select-none audit-toggle">
                            <div class="col-span-6 md:col-span-1 mono text-sm text-indigo-600 font-medium truncate">
                                <a href="${esc(pr.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">#${pr.pr_number}</a>
                            </div>
                            <div class="col-span-6 md:col-span-5 text-sm font-medium text-gray-900 truncate" title="${esc(pr.title)}">${esc(pr.title)}</div>
                            <div class="hidden md:col-span-2 md:flex justify-center">${countChip(t.undisclosed_changes, 'bg-rose-50 text-rose-700', `${t.undisclosed_changes} undisclosed`)}</div>
                            <div class="hidden md:col-span-1 md:flex justify-center">${countChip(t.scope_flags, 'bg-amber-50 text-amber-700')}</div>
                            <div class="hidden md:col-span-1 md:flex justify-center">${countChip(t.predicted_questions, 'bg-purple-50 text-purple-700', `${t.predicted_questions} Qs`)}</div>
                            <div class="hidden md:col-span-1 md:flex justify-center" title="Agent consensus: ${esc(consensusKey)}">
                                <span class="w-2.5 h-2.5 rounded-full ${consensus.dot}"></span>
                            </div>
                            <div class="col-span-6 md:col-span-1 flex md:justify-end">
                                <span class="px-3 py-1 rounded-md text-sm font-semibold ${BAND_STYLES[band].chip}${flag}">${pr.communication_debt_score}</span>
                            </div>
                        </div>
                        ${renderPanel(pr)}
                    </div>`;
                }).join('');

                tableContainer.innerHTML = `
                    <div class="grid grid-cols-12 gap-3 px-6 py-4 bg-gray-50/60 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <div class="col-span-6 md:col-span-1">PR</div>
                        <div class="col-span-6 md:col-span-5">Pull Request</div>
                        <div class="hidden md:col-span-2 md:block text-center">Undisclosed</div>
                        <div class="hidden md:col-span-1 md:block text-center">Scope</div>
                        <div class="hidden md:col-span-1 md:block text-center">Qs</div>
                        <div class="hidden md:col-span-1 md:block text-center" title="Agent consensus">Cons.</div>
                        <div class="col-span-6 md:col-span-1 text-right">Debt</div>
                    </div>
                    ${rows}`;

                tableContainer.addEventListener('click', (event) => {
                    const toggle = event.target.closest('.audit-toggle');
                    if (!toggle) return;
                    toggle.nextElementSibling.classList.toggle('hidden');
                });
            } catch (error) {
                console.error(error);
                tableContainer.innerHTML = `
                    <div class="p-8 text-center text-rose-600 space-y-2">
                        <p class="font-medium">Could not load dashboard data.</p>
                        <p class="text-sm text-gray-500">${esc(error.message)}</p>
                        <p class="text-sm text-gray-500">Run <span class="mono">python dashboard/render_dashboard.py</span> to regenerate it.</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
